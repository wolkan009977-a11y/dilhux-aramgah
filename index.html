<!DOCTYPE html>
<html lang="ug">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DILHUX Aramgah</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

header{
  padding:25px;
  border-bottom:1px solid #c9a227;
  color:#c9a227;
  font-size:28px;
  font-weight:bold;
}

.hero{
  padding:70px 20px;
}

h1{
  color:#c9a227;
  font-size:42px;
}

button{
  background:#c9a227;
  color:#000;
  border:0;
  padding:15px 35px;
  border-radius:30px;
  font-size:18px;
}

.card{
  background:#171717;
  margin:20px auto;
  padding:20px;
  max-width:350px;
  border-radius:15px;
  border:1px solid #c9a227;
}

.price{
  color:#c9a227;
  font-size:22px;
}
</style>

</head>

<body>

<header>
☕ DILHUX Aramgah
</header>


<div class="hero">

<h1>
تەم ۋە ئارام بىرلەشكەن جاي
</h1>

<p>
Premium Cafe Digital Menu
</p>

<button>
🍽️ Menu كۆرۈش
</button>

</div>


<div class="card">
<h2>🔥 قوي گۆشى كاۋاپ</h2>
<p>ساپ قوي گۆشىدىن تەييارلانغان</p>
<div class="price">₺250</div>
</div>


<div class="card">
<h2>☕ قارا قەھۋە</h2>
<p>ئالاھىدە پىشۇرۇلغان قەھۋە</p>
<div class="price">₺90</div>
</div>


<div class="card">
<h2>🥤 سوغۇق ئىچىملىك</h2>
<p>سۈپەتلىك ئىچىملىك</p>
<div class="price">₺70</div>
</div>


</body>
</html>
